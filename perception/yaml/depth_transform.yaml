# Depth image to pseudo LaserScan configuration for Isaac Sim FPV camera.
coordinate_system: "opengl"

sensor_cfg:
  # sim_single.py uses 90 deg horizontal FOV at 640x480.
  # The corresponding vertical FOV is about 73.74 deg.
  fov_deg: [90.0, 73.74]
  # Isaac Sim ROS2 depth is normally 32FC1 in meters.
  dist_scale: 1.0

transform_cfg:
  rotate_points: []
  # Keep a thin horizontal band around the camera optical axis.
  # OpenGL camera frame: X right, Y up, Z forward-negative.
  filter_points: [["y", -0.25, 0.25]]

projection_cfg:
  map_resolution: 0.1
  map_size: 100

laserscan_cfg:
  aggregation: "min"
  n_intervals: 90
  default_value: 4.5
