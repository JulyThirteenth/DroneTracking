runtime:
  controller: mpc
  solver: osqp

fsm:
  cmd_topic: /fsm_1/cmd
  state_topic: /fsm_1/state
  path_topic: /tracking_1/path
  ref_path_topic: /tracking_1/ref_traj_path
  log_dir: ""
  log_enabled: true
  log_flush_every: 1
  takeoff_velocity: 0.5
  auto_land: true
  auto_land_distance: 0.1
  auto_land_velocity: 0.1
  auto_land_hold_cycles: 20

plan2track:
  path_topic: /planning_1/path
  ref_path_topic: /tracking_1/ref_traj_path
  out_path_topic: /tracking_1/path
  vehicle_pose_topic: /tracking_1/vehicle_pose
  yaw_cmd_topic: /planning_1/yaw_cmd_enu
  fixed_yaw: false
  init_yaw: 0.0
  path_file: ""
  origin_mode: first_xy
  frame_id: map
  loop: false

tracking_ros:
  offboard_control_mode_topic: /px4_1/fmu/in/offboard_control_mode
  vehicle_rates_setpoint_topic: /px4_1/fmu/in/vehicle_rates_setpoint
  vehicle_command_topic: /px4_1/fmu/in/vehicle_command
  vehicle_local_position_topic: /px4_1/fmu/out/vehicle_local_position
  target_system: 2
  pub_offboard: true

tracking:
  tasks:
    dir_name: plan2track/waypoints
    waypoint_file: comp_waypoint_2.txt
  mpc:
    dt: 0.1
    horizon: 15
    v_ref: 1.0
  control:
    dt: 0.01
  yaw:
    kp: 0.06
    yaw_rate_limit: null
  ctbr:
    hover_thrust: 0.575
    g: 9.81
    thrust_min: 0.1
    thrust_max: 0.9
  accel_fusion:
    imu_alpha: 0.02
  constraints:
    u_min: [-25.0, -25.0, -25.0]
    u_max: [25.0, 25.0, 25.0]
    du_min: [-50.0, -50.0, -50.0]
    du_max: [50.0, 50.0, 50.0]
    v_min: [-8.0, -8.0, -8.0]
    v_max: [8.0, 8.0, 8.0]
    a_min: [-20.0, -20.0, -10.0]
    a_max: [20.0, 20.0, 20.0]
    v_slack_weight: 10000.0
    a_slack_weight: 10000.0
  mpc_cost:
    Q_diag: [2000.0, 2000.0, 2000.0]
    R_diag: [0.0, 0.0, 0.0]
    Rd_diag: [0.2, 0.2, 0.2]
    terminal: 1.0
  mpcc_cost:
    q_contour: 500.0
    q_lag: 2.0
    q_progress: 1.0
    q_terminal_s: 10.0
    vs_max: 1.0
    vs_min: 0.0
