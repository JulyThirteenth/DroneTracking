runtime:
  controller: mpc
  solver: osqp

topics:
  fsm:
    cmd: /fsm/cmd
    state: /fsm/state
  planning:
    path: /planning/path
    yaw_cmd_enu: /planning/yaw_cmd_enu
  tracking:
    path: /tracking/path
    ref_traj_path: /tracking/ref_traj_path
    vehicle_pose: /tracking/vehicle_pose
  px4:
    offboard_control_mode: /fmu/in/offboard_control_mode
    vehicle_rates_setpoint: /fmu/in/vehicle_rates_setpoint
    vehicle_command: /fmu/in/vehicle_command
    vehicle_local_position: /fmu/out/vehicle_local_position
  perception:
    scan: /depth2scan/scan

vehicle:
  target_system: 1
  pub_offboard: true

fsm:
  log:
    dir: ""
    enabled: true
    flush_every: 1
  takeoff:
    velocity: 0.4
    height: 1.0
  auto_land:
    enabled: false
    distance: 0.1
    velocity: 0.1
    hold_cycles: 20

plan2track:
  path:
    file: plan2track/waypoints/line_waypoint.txt
    origin_mode: first_xy
    frame_id: map
    loop: false
  yaw:
    fixed: false
    init: 0.0

tracking:
  control_loop:
    dt: 0.01
  mpc:
    dt: 0.1
    horizon: 15
    v_ref: 3.0
    cost:
      Q_diag: [120.0, 120.0, 300.0]
      R_diag: [0.2, 0.2, 0.2]
      Rd_diag: [1.5, 1.5, 1.5]
      terminal: 1.0
  mpcc:
    cost:
      q_contour: 200.0
      q_lag: 1.0
      q_progress: 1.0
      q_terminal_s: 0.0
    progress:
      vs_max: 3.0
      vs_min: 0.0
  yaw:
    kp: 0.04
    yaw_rate_limit: 1.57
  ctbr:
    hover_thrust: 0.58
    g: 9.81
    thrust_min: 0.1
    thrust_max: 0.9
  accel_fusion:
    imu_alpha: 0.05
  constraints:
    u_min: [-8.0, -8.0, -6.0]
    u_max: [8.0, 8.0, 6.0]
    du_min: [-20.0, -20.0, -15.0]
    du_max: [20.0, 20.0, 15.0]
    v_min: [-8.0, -8.0, -8.0]
    v_max: [8.0, 8.0, 8.0]
    a_min: [-3.0, -3.0, -10.0]
    a_max: [3.0, 3.0, 3.0]
    v_slack_weight: 10000.0
    a_slack_weight: 10000.0
  hocbf:
    enabled: true
    depth_camera_xyz: [0.1, 0.0, 0.02]
    obstacle_min_radius_m: 0.1
    max_obstacles: 90
    safe_distance: 0.5
    lambda_gain: 0.8
    slack_weight: 1000000.0
