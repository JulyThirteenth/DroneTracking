runtime:
  controller: mpc
  solver: osqp

topics:
  fsm:
    cmd: /fsm/cmd
    state: /fsm/state
  planning:
    path: /planning/path
    yaw_cmd_enu: /planning/yaw_cmd_enu
  tracking:
    path: /tracking/path
    ref_traj_path: /tracking/ref_traj_path
    vehicle_pose: /tracking/vehicle_pose
  px4:
    offboard_control_mode: /fmu/in/offboard_control_mode
    vehicle_rates_setpoint: /fmu/in/vehicle_rates_setpoint
    vehicle_command: /fmu/in/vehicle_command
    vehicle_local_position: /fmu/out/vehicle_local_position
  perception:
    scan: /depth2scan/scan

vehicle:
  target_system: 2
  pub_offboard: false

fsm:
  log:
    dir: ""
    enabled: true
    flush_every: 1
  takeoff:
    velocity: 0.4
    height: 1.0
  auto_land:
    enabled: true
    distance: 0.1
    velocity: 0.1
    hold_cycles: 20

plan2track:
  path:
    file: ""
    origin_mode: first_xy
    frame_id: map
    loop: false
  yaw:
    fixed: true
    init: 0.0

tracking:
  tasks:
    dir_name: plan2track/waypoints
    waypoint_file: comp_waypoint_1.txt
  control_loop:
    dt: 0.01
  mpc:
    dt: 0.1
    horizon: 15
    v_ref: 1.5
    cost:
      Q_diag: [2000.0, 2000.0, 2000.0]
      R_diag: [0.0, 0.0, 0.0]
      Rd_diag: [0.2, 0.2, 0.2]
      terminal: 1.0
  mpcc:
    cost:
      q_contour: 500.0
      q_lag: 2.0
      q_progress: 1.0
      q_terminal_s: 10.0
    progress:
      vs_max: 1.0
      vs_min: 0.0
  yaw:
    kp: 0.04
    yaw_rate_limit: 1.57
  ctbr:
    hover_thrust: 0.38
    g: 9.81
    thrust_min: 0.1
    thrust_max: 0.8
  accel_fusion:
    imu_alpha: 0.01
  constraints:
    u_min: [-25.0, -25.0, -25.0]
    u_max: [25.0, 25.0, 25.0]
    du_min: [-50.0, -50.0, -50.0]
    du_max: [50.0, 50.0, 50.0]
    v_min: [-8.0, -8.0, -8.0]
    v_max: [8.0, 8.0, 8.0]
    a_min: [-20.0, -20.0, -10.0]
    a_max: [20.0, 20.0, 20.0]
    v_slack_weight: 10000.0
    a_slack_weight: 10000.0
