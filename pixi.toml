[workspace]
authors = ["Julythirteenth <shawwong@yeah.net>"]
channels = ["https://prefix.dev/robostack-humble", "conda-forge"]
name = "DroneTracking"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
setuptools = "79.0.1.*"
numpy = ">=2.5.2,<3"
scipy = ">=1.18.0,<2"
osqp = ">=1.1.3,<2"

[pypi-dependencies]
spatialmath-python = ">=1.1.17, <2"
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cu129" }

[activation.env]
LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6"
ROS_DOMAIN_ID = "0"
ROS_LOCALHOST_ONLY = "0"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
