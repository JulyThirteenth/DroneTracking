# Pegasus Simulator Iris parameters (main branch, checked 2026-08-29).
# Body convention in sys_uav.py: FRD; rotor order is
# front-left, front-right, rear-right, rear-left.

mass: 1.5
arm_length: 0.25015
inertia:
  - [0.029125, 0.0, 0.0]
  - [0.0, 0.029125, 0.0]
  - [0.0, 0.0, 0.055225]

# Pegasus QuadraticThrustCurve: force/torque = coefficient * omega^2.
thrust_coeff: 8.54858e-6
torque_coeff: 1.0e-6

# Practical actuator model around the Pegasus rotor-speed interface.
motor_time_constant: 0.02
motor_noise_std: 2.0
rotor_min_speed: 0.0
rotor_max_speed: 1100.0

g: 9.81

# Pegasus rotor indices [0, 1, 2, 3] have directions [-1, -1, 1, 1].
# Reordered from Pegasus [2, 1, 3, 0] into sys_uav's X-frame ordering:
rotor_direction: [1, -1, 1, -1]

# Pegasus IrisConfig uses LinearDrag([0.50, 0.30, 0.0]).
drag_force_coeff: [0.50, 0.30, 0.0]
# Linear body-rate damping: tau_drag = -diag(coeff) * body_rate.
drag_torque_coeff: [0.01, 0.01, 0.02]
